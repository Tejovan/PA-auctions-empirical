# modified test run: exercises every part of the code on small grids in about a minute.
#   python run.py configs/standard_test.toml --yes
# Two distributions (a synthetic one where ironing binds, and the tweet data at two ζ),
# two bidder counts, two good counts, three threshold forms, both objectives, both methods.
# Short searches and coarse grids: thresholds are good, not fully optimal.

kind = "optimize"
name = "interpret-test"
description = "test to interpret outputs."

[[distributions]]
source = "harm_rises"
options = {correlation = -0.2}
externality_scales = 2
num_externality_nodes = 511
num_valuation_cells = 50

[[distributions]]
source = "tweets"                # Community Notes data, data/samples/g_full_tweets.csv
externality_scales = [100]
num_externality_nodes = 51
num_valuation_cells = 50

[markets]
num_bidders = [6]
num_goods = [1, 3]

[design]
objectives = ["vcg_pa", "ivcg_pa"]

[[optimizers]]
label = "ga"                     # genetic stage + Nelder–Mead, short
method = "genetic"
threshold_forms = ["knots8"]
num_generations = 15
population_size = 16
num_parents_mating = 6
stall_generations = 8
num_local_starts = 2
local_max_evaluations = 60
num_restarts = 2                 # enough to exercise restarts (default 4)

[[optimizers]]
label = "br"                     # best-response ascent
method = "best_response"
threshold_forms = ["knots8"]
max_iterations = 100
num_random_starts = 2            # default 3
short_genetic_generations = 10    # default 40

[evaluation]
num_simulated_auctions = 2000
num_bootstrap = 50

[checks]
grid_refinement = true
bandwidth_sensitivity = [0.5, 2.0]
