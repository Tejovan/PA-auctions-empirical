# WEB27 empirical section, synthetic part: given-τ benchmarks on the same markets as
# configs/synthetic_run.toml (zero-welfare threshold τ⁰ and ex ante welfare cutoff τ*).
#   python run.py configs/synthetic_benchmarks.toml --dry-run
#   python run.py configs/synthetic_benchmarks.toml --yes

kind = "evaluate"
name = "synthetic-benchmarks"
description = "Given-τ benchmarks for the synthetic part of the WEB27 empirical section: zero-welfare threshold and ex ante welfare cutoff on harmful_middle, n ∈ {2,4,8,16,32} × k ∈ {1,2,4,8}."

[[distributions]]
source = "harmful_middle"

[markets]
num_bidders = [2, 4, 8, 16, 32]
num_goods = [1, 2, 4, 8]

[[thresholds]]
label = "zero-welfare"           # τ⁰(e) = max(0, −e): participate iff v + e ≥ 0
cutoff = 0.0

[[thresholds]]
label = "ex-ante"                # τ*(e) = max(0, w* − e), Pr[v + e > w*] = min{k/n, Pr[v + e > 0]}
cutoff = "ex_ante"

[evaluation]
num_simulated_auctions = 5000

[checks]
grid_refinement = true
