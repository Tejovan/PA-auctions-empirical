# Real run on the nodes form: best-response ascent (all starts) and the symmetric relaxation
# (ascent from the relaxation's τ only), both objectives, two distributions.
#   python run.py configs/nodes_run.toml --yes
# Default grids (harmful_middle 151 × 150, tweets 241 × 400); 100 iterations, 3 polishes,
# 3 random starts, 20-generation short genetic start: more thorough than the standard test.
# Estimate 5.0 min on a MacBook Pro M4 (with 40 generations, the default: 5.8 min of
# computation).
# n = 4, k = 4 is the no-competition edge case (every participant gets a good); the
# relaxation needs k < n and is skipped there.

kind = "optimize"
name = "nodes-run"
description = "Best-response ascent and symmetric relaxation on the nodes form: harmful_middle and tweets (ζ = 1, 10, 100), n ∈ {4, 8}, k ∈ {1, 4}, VCG-PA and IVCG-PA."

[[distributions]]
source = "harmful_middle"        # steep ridge with a wiggle; ironing binds

[[distributions]]
source = "tweets"                # Community Notes data, data/samples/g_full_tweets.csv
externality_scales = [1.0, 10.0, 100.0]

[markets]
num_bidders = [4, 8]
num_goods = [1, 4]

[design]
objectives = ["vcg_pa", "ivcg_pa"]

[[optimizers]]
label = "br"                     # best-response ascent: zero, zero_welfare, short_genetic,
method = "best_response"         # relaxation and 3 random starts; best start kept
threshold_forms = ["nodes"]
max_iterations = 100
num_random_starts = 3
short_genetic_generations = 20
polish_rounds = 3

[[optimizers]]
label = "relax"                  # symmetric relaxation, then best-response ascent from it
method = "relaxation"
threshold_forms = ["nodes"]
max_iterations = 100
polish_rounds = 3

[evaluation]
num_simulated_auctions = 5000
num_bootstrap = 200

[checks]
grid_refinement = true
bandwidth_sensitivity = [0.5, 2.0]
