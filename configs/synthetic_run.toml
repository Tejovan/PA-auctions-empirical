# WEB27 empirical section, synthetic part: harmful_middle (ironing binds) over a grid of
# markets, both objectives, nodes form by best-response ascent, plus the best common welfare
# cutoff as a one-parameter benchmark.
#   python run.py configs/synthetic_run.toml --dry-run
#   python run.py configs/synthetic_run.toml --yes
# Benchmarks with given τ (zero-welfare τ⁰, ex ante cutoff τ*): configs/synthetic_benchmarks.toml.
#
# Markets: n ∈ {2, 4, 8, 16, 32} × k ∈ {1, 2, 4, 8}. Fixed ratios n/k ∈ {2, 4, 8} lie on the
# diagonals: (2,1) (4,2) (8,4) (16,8); (4,1) (8,2) (16,4) (32,8); (8,1) (16,2) (32,4).
# The 6 cells with k ≥ n are the no-competition case (τ⁰ optimal); they are cheap and serve as
# a check. The symmetric relaxation needs k < n and is skipped there.
#
# No separate relaxation optimizer: the relaxation's τ is a default start of the ascent
# (its welfare is recorded in results.json → search.starts), and the check
# symmetric_relaxation (default on) records the relaxation value J and the threshold-rule flag
# for every combination with k < n.

kind = "optimize"
name = "synthetic-run"
description = "Synthetic part of the WEB27 empirical section: harmful_middle, n ∈ {2,4,8,16,32} × k ∈ {1,2,4,8}, VCG-PA and IVCG-PA objectives; nodes by best-response ascent, common welfare cutoff by genetic search."

[[distributions]]
source = "harmful_middle"        # default options and grid (151 × 150)

[markets]
num_bidders = [2, 4, 8, 16, 32]
num_goods = [1, 2, 4, 8]

[design]
objectives = ["vcg_pa", "ivcg_pa"]

[[optimizers]]
label = "br"                     # starts: zero, zero_welfare, short_genetic, relaxation, 3 random
method = "best_response"
threshold_forms = ["nodes"]
max_iterations = 100
num_random_starts = 3
short_genetic_generations = 20
polish_rounds = 3

[[optimizers]]
label = "ga"                     # best common welfare cutoff τ(e) = max(0, w − e): one parameter
method = "genetic"
threshold_forms = ["cutoff"]
num_generations = 200
num_restarts = 2
num_local_starts = 2

[evaluation]
num_simulated_auctions = 5000

[checks]
grid_refinement = true
